name: Build Android APK & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          sdk-platform: 34
          build-tools: 34.0.0
          ndk: 26.1.10909125

      # Release tag comes from the tag itself when tag-triggered, otherwise
      # from the app version in app.json. A branch build whose version tag
      # already exists still produces an artifact, but publishes no release —
      # so bumping expo.version is what cuts a new downloadable release.
      - name: Resolve release tag
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            TAG="v$(node -p "require('./app.json').expo.version")"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              PUBLISH=false
            else
              PUBLISH=true
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Release tag ${TAG} (publish=${PUBLISH})"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Prebuild Android project
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          NAMED="vinu-${{ steps.release.outputs.tag }}.apk"
          cp "${APK}" "${NAMED}"
          echo "path=${NAMED}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
